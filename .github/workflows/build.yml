name: Build Native Camera IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Genera Icona Fotocamera iOS
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          if [ -f "camera-icon.jpg" ]; then
            sips -s format png -z 1024 1024 camera-icon.jpg --out Assets.xcassets/AppIcon.appiconset/icon.png
          elif [ -f "camera-icon.png" ]; then
            sips -s format png -z 1024 1024 camera-icon.png --out Assets.xcassets/AppIcon.appiconset/icon.png
          else
            # Disegna automaticamente l'icona Fotocamera se non è presente alcun file esterno
            swift -e '
            import AppKit
            let size = NSSize(width: 1024, height: 1024)
            let img = NSImage(size: size)
            img.lockFocus()
            NSColor(calibratedWhite: 0.82, alpha: 1.0).setFill()
            NSBezierPath(rect: NSRect(origin: .zero, size: size)).fill()
            NSColor(calibratedWhite: 0.18, alpha: 1.0).setFill()
            NSBezierPath(roundedRect: NSRect(x: 180, y: 280, width: 664, height: 440), xRadius: 80, yRadius: 80).fill()
            NSBezierPath(roundedRect: NSRect(x: 380, y: 680, width: 264, height: 90), xRadius: 30, yRadius: 30).fill()
            NSColor(calibratedWhite: 0.82, alpha: 1.0).setFill()
            NSBezierPath(ovalIn: NSRect(x: 372, y: 360, width: 280, height: 280)).fill()
            NSColor(calibratedWhite: 0.18, alpha: 1.0).setFill()
            NSBezierPath(ovalIn: NSRect(x: 412, y: 400, width: 200, height: 200)).fill()
            NSColor(calibratedRed: 1.0, green: 0.8, blue: 0.0, alpha: 1.0).setFill()
            NSBezierPath(ovalIn: NSRect(x: 680, y: 600, width: 44, height: 44)).fill()
            img.unlockFocus()
            if let tiff = img.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff), let png = rep.representation(using: .png, properties: [:]) {
                try! png.write(to: URL(fileURLWithPath: "Assets.xcassets/AppIcon.appiconset/icon.png"))
            }
            '
          fi
          cat <<EOF > Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "icon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

      - name: Genera Progetto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compila App iOS
        run: |
          xcodebuild -project Fotocamera.xcodeproj \
            -scheme Fotocamera \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Impacchetta Fotocamera.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Fotocamera.app Payload/
          zip -r Fotocamera.ipa Payload

      - name: Carica Artifact IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fotocamera-IPA
          path: Fotocamera.ipa
